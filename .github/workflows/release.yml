name: Build signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NUVORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NUVORA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing NUVORA_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing NUVORA_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing NUVORA_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing NUVORA_KEY_PASSWORD" && exit 1)

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NUVORA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nuvora-release.jks"
          chmod 600 "$RUNNER_TEMP/nuvora-release.jks"

      - name: Build signed Release APK
        env:
          NUVORA_KEYSTORE_PATH: ${{ runner.temp }}/nuvora-release.jks
          NUVORA_STORE_PASSWORD: ${{ secrets.NUVORA_STORE_PASSWORD }}
          NUVORA_KEY_ALIAS: ${{ secrets.NUVORA_KEY_ALIAS }}
          NUVORA_KEY_PASSWORD: ${{ secrets.NUVORA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nuvora-1.0.3-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
